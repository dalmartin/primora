[project]
name = "primora-pipeline"
version = "0.1.0"
description = "Data pipeline + models: SimplifyJobs git history -> DuckDB/Parquet -> opening predictions."
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "polars",
    "pyarrow",
    "pandas",
    "lifelines",
    "scikit-survival",
    "matplotlib",
    "mlflow",
    "supabase",
    "orjson>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primora_pipeline"]
