<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- Faint cold-press paper grain, tiled under everything. -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .38  0 0 0 .13 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#grain)"/>
</svg>
