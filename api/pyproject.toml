[project]
name = "primora-api"
version = "0.1.0"
description = "Primora FastAPI backend (served on Modal)."
requires-python = ">=3.11"
dependencies = ["fastapi[standard]", "supabase", "pyjwt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primora_api"]
